[build]
  publish = "."

# ── .html → clean URL redirects ──────────────────────────────────
# Netlify serves .html files at both /page.html and /page with no redirect.
# Google sees these as duplicate URLs. These rules 301-redirect .html → clean.

# Index files: redirect to directory path (must come before catch-all)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services/index.html"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/assistance/index.html"
  to = "/assistance/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/index.html"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/index.html"
  to = "/blog/"
  status = 301
  force = true

# Catch-all: any remaining .html → clean URL
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Section paths without trailing slash → with trailing slash
[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/assistance"
  to = "/assistance/"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

# ── Merged/removed pages ────────────────────────────────────────
# Daycare page merged into Child-Care & Schools
[[redirects]]
  from = "/services/daycare-facility"
  to = "/services/child-care-schools"
  status = 301

[[redirects]]
  from = "/services/daycare-facility.html"
  to = "/services/child-care-schools"
  status = 301

# Legacy clearance-exam → primary lead-clearance-exam page
[[redirects]]
  from = "/services/clearance-exam"
  to = "/services/lead-clearance-exam"
  status = 301

[[redirects]]
  from = "/services/clearance-exam.html"
  to = "/services/lead-clearance-exam"
  status = 301

# Dust Wipe Sampling removed — redirect to Lead Clearance Exam
[[redirects]]
  from = "/services/dust-wipe-sampling"
  to = "/services/lead-clearance-exam"
  status = 301

[[redirects]]
  from = "/services/dust-wipe-sampling.html"
  to = "/services/lead-clearance-exam"
  status = 301

# Dust Soil Sampling removed — redirect to Lead Risk Assessment
[[redirects]]
  from = "/services/dust-soil-sampling"
  to = "/services/lead-risk-assessment"
  status = 301

[[redirects]]
  from = "/services/dust-soil-sampling.html"
  to = "/services/lead-risk-assessment"
  status = 301

# 20-Year Exemption merged into Lead-Based Paint Inspection
[[redirects]]
  from = "/services/20-year-exemption"
  to = "/services/lead-based-paint-inspection"
  status = 301

[[redirects]]
  from = "/services/20-year-exemption.html"
  to = "/services/lead-based-paint-inspection"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin"

# Cache static assets — short cache with revalidation so deploys take effect
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
