[build]
  publish = "."

# ── .html → clean URL redirects ──────────────────────────────────
# Netlify serves .html files at both /page.html and /page with no redirect.
# Google sees these as duplicate URLs. These rules 301-redirect .html → clean.

# Index files: redirect to directory path (must come before catch-all)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services/index.html"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/assistance/index.html"
  to = "/assistance/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/index.html"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/index.html"
  to = "/blog/"
  status = 301
  force = true

